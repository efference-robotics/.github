name: Feature
description: A new capability or a change in behaviour.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or painful today, and who needs it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should exist afterwards; include interfaces, formats or examples where they matter.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable checks that decide when this is done; each should be testable without asking the author.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Related work that this issue deliberately does not include.
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: References
      description: Related issues, decisions, documents or upstream projects.
    validations:
      required: false
